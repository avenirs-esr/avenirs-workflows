name: Run E2E Tests
description: Run Playwright E2E tests for frontend projects

inputs:
  package-manager:
    description: Package manager used to run application and E2E commands
    required: false
    default: 'pnpm'
  working-directory:
    description: Application directory relative to the checkout root
    required: false
    default: '.'
  base_url:
    description: Base URL for e2e tests
    required: false
    default: 'http://localhost:4173/cofolio/'
  username:
    description: Username for authentication (not used for now)
    required: false
  password:
    description: Password for authentication (not used for now)
    required: false
  enable_msw:
    description: Enable MSW mocking
    required: false
    default: 'true'
  upload_report:
    description: Upload Playwright report as artifact
    required: false
    default: 'true'
  run_local_preview:
    description: Build and run local preview server before e2e tests
    required: false
    default: 'false'
  chrome_only:
    description: Run e2e tests only on Chrome (faster)
    required: false
    default: 'false'
  review_mode:
    description: Enable review mode to skip tests for features hidden in demo mode
    required: false
    default: 'true'
  need_to_checkout:
    description: Whether the action needs to checkout the code (set to false if parent workflow already checks out)
    required: false
    default: 'false'
  token:
    description: GitHub token for checkout (if needed)
    required: false
    default: ''
  empty_dataset_access_token:
    description: Token for empty dataset user (used for @dataset-empty E2E scenarios)
    required: false
  shard:
    description: Current shard index (e.g. "1"). Leave empty to run all tests without sharding.
    required: false
    default: ''
  total_shards:
    description: Total number of shards (e.g. "4"). Used only when shard is set.
    required: false
    default: '1'
runs:
  using: composite
  steps:
    - name: ✅ Checkout cofolio client (develop)
      if: ${{ inputs.need_to_checkout == 'true' }}
      uses: actions/checkout@v4
      with:
        repository: avenirs-esr/avenirs-cofolio-client
        ref: develop
        token: ${{ inputs.token }}
        path: avenirs-cofolio-client
        fetch-depth: 1

    - name: 📁 Resolve application and E2E paths
      id: paths
      shell: bash
      env:
        NEED_TO_CHECKOUT: ${{ inputs.need_to_checkout }}
        APP_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        root_directory=.
        if [ "$NEED_TO_CHECKOUT" = true ]; then
          root_directory=avenirs-cofolio-client
        fi
        app_directory="$root_directory/$APP_DIRECTORY"
        printf 'root-directory=%s\n' "$root_directory" >> "$GITHUB_OUTPUT"
        printf 'app-directory=%s\n' "$app_directory" >> "$GITHUB_OUTPUT"
        printf 'e2e-directory=%s/e2e\n' "$app_directory" >> "$GITHUB_OUTPUT"

    - name: 🔧 Set up Node.js and install dependencies
      if: ${{ inputs.need_to_checkout == 'true' }}
      uses: avenirs-esr/avenirs-workflows/.github/actions/setup-node@main
      with:
        package-manager: ${{ inputs.package-manager }}
        working-directory: ${{ steps.paths.outputs.root-directory }}

    - name: 🏗️ Build project (skip type-check for e2e)
      if: ${{ inputs.run_local_preview == 'true' }}
      working-directory: ${{ steps.paths.outputs.app-directory }}
      shell: bash
      run: ${{ inputs.package-manager }} run build-only:development
      env:
        VITE_ENABLE_MSW: ${{ inputs.enable_msw }}

    - name: 🚀 Start preview server
      if: ${{ inputs.run_local_preview == 'true' }}
      working-directory: ${{ steps.paths.outputs.app-directory }}
      shell: bash
      run: ${{ inputs.package-manager }} run preview:development &

    - name: ⏳ Wait for preview server
      if: ${{ inputs.run_local_preview == 'true' }}
      working-directory: ${{ steps.paths.outputs.app-directory }}
      shell: bash
      run: |
        echo "Waiting for preview server to be ready..."
        timeout 60 bash -c 'until curl -s ${{ inputs.base_url }} > /dev/null 2>&1; do sleep 1; done'
        echo "Preview server is ready!"

    - name: 📦 Install e2e dependencies
      if: ${{ inputs.package-manager == 'npm' }}
      shell: bash
      working-directory: ${{ steps.paths.outputs.e2e-directory }}
      run: npm ci

    - name: 🔍 Get Playwright version
      id: playwright-version
      shell: bash
      working-directory: ${{ steps.paths.outputs.e2e-directory }}
      run: |
        version=$(${{ inputs.package-manager == 'pnpm' && 'pnpm exec' || 'npx' }} playwright --version | awk '{print $2}')
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - name: 🗄️ Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: 🎭 Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ steps.paths.outputs.e2e-directory }}
      run: ${{ inputs.package-manager }} run e2e:install

    - name: 🎭 Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: ${{ steps.paths.outputs.e2e-directory }}
      run: ${{ inputs.package-manager == 'pnpm' && 'pnpm exec' || 'npx' }} playwright install-deps

    - name: 🧪 Run e2e tests
      id: e2e_tests
      shell: bash
      working-directory: ${{ steps.paths.outputs.e2e-directory }}
      run: |
        script=e2e
        if [ "$CHROME_ONLY" = true ]; then
          script=e2e:chrome
        fi
        args=()
        if [ -n "$SHARD" ]; then
          args+=(--reporter=blob "--shard=$SHARD/$TOTAL_SHARDS")
        fi
        if [ "$PACKAGE_MANAGER" = pnpm ]; then
          pnpm run "$script" "${args[@]}"
        else
          npm run "$script" -- "${args[@]}"
        fi
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        CHROME_ONLY: ${{ inputs.chrome_only }}
        SHARD: ${{ inputs.shard }}
        TOTAL_SHARDS: ${{ inputs.total_shards }}
        CI: 'true'
        VITE_API_URL: ${{ inputs.base_url }}
        USERNAME: ${{ inputs.username }}
        PASSWORD: ${{ inputs.password }}
        REVIEW_MODE: ${{ inputs.review_mode }}
        EMPTY_DATASET_ACCESS_TOKEN: ${{ inputs.empty_dataset_access_token }}
        MSW_MODE_ON: ${{ inputs.enable_msw }}

    - name: 📦 Upload blob report (shard ${{ inputs.shard }})
      if: ${{ always() && inputs.shard != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: blob-report-${{ inputs.shard }}
        path: ${{ steps.paths.outputs.e2e-directory }}/blob-report
        if-no-files-found: ignore
        retention-days: 5

    - name: 📦 Upload Playwright Report
      if: ${{ always() && inputs.upload_report == 'true' && inputs.shard == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: ${{ steps.paths.outputs.e2e-directory }}/playwright-report
        if-no-files-found: ignore
        retention-days: 5
