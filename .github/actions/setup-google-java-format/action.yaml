name: "Setup Google Java Format"
description: "Installe Google Java Format"
inputs:
  java-version:
    description: "Version Java au format <version>-<vendor> (ex: 25.0.4-oracle), issue de la variable d'organisation JAVA_VERSION"
    required: true
runs:
  using: "composite"
  steps:
    - name: Parse Java version
      id: parse_java_version
      run: |
        JAVA_VERSION="${{ inputs.java-version }}"
        echo "version=${JAVA_VERSION%-*}" >> "$GITHUB_OUTPUT"
        echo "distribution=${JAVA_VERSION##*-}" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: ${{ steps.parse_java_version.outputs.distribution }}
        java-version: ${{ steps.parse_java_version.outputs.version }}

    - name: Install Google Java Format
      run: |
        curl -L -o google-java-format.jar https://github.com/google/google-java-format/releases/download/v1.27.0/google-java-format-1.27.0-all-deps.jar
        echo "Google Java Format installed."
      shell: bash
