name: Accessibility Check and Deploy

on:
  workflow_call:
    inputs:
      report-prefix:
        description: "Application subdirectory for accessibility reports"
        type: string
        required: false
        default: ""
      flat-report:
        description: "Use the flat HTML report layout instead of student/staff directories"
        type: boolean
        required: false
        default: false
      package-manager:
        type: string
        required: false
        default: pnpm
      working-directory:
        type: string
        required: false
        default: .
      playwright-image:
        type: string
        required: false
        default: mcr.microsoft.com/playwright:v1.56.1-noble
      build-command:
        description: "Custom build command, otherwise build-only:development is run with the selected package manager"
        required: false
        default: ""
        type: string
      continue-on-error:
        description: "Whether to continue the workflow if the accessibility tests fail"
        required: false
        default: true
        type: boolean

jobs:
  a11y-test-and-deploy-reports:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.playwright-image }}
      options: --user 1001
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Node.js with npm cache
        uses: avenirs-esr/avenirs-workflows/.github/actions/setup-node@main
        with:
          package-manager: ${{ inputs.package-manager }}

      - name: 🏗️ Build
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command || format('{0} run build-only:development', inputs.package-manager) }}
        env:
          VITE_ENABLE_MSW: true

      - name: 👮‍♂️ Run accessibility test
        id: a11y-test
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.package-manager }} run test:a11y
        continue-on-error: ${{ inputs.continue-on-error }}
        env:
          VITE_ENABLE_MSW: true

      - name: ↔️ Move accessibility report to temp folder
        if: steps.a11y-test.outcome == 'failure'
        env:
          A11Y_REPORTS_DIR: ${{ inputs.working-directory }}/a11y/reports
        run: |
          mkdir -p gh-pages-tmp
          mv "$A11Y_REPORTS_DIR"/* gh-pages-tmp/

      - name: 🔎 Resolve accessibility report destination
        id: report-path
        if: steps.a11y-test.outcome == 'failure'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_PREFIX: ${{ inputs.report-prefix }}
        run: |
          if [[ -n "$REPORT_PREFIX" && ! "$REPORT_PREFIX" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::report-prefix must contain only letters, digits, underscores or hyphens"
            exit 1
          fi
          destination="accessibility-reports/$PR_NUMBER"
          if [ -n "$REPORT_PREFIX" ]; then
            destination="$destination/$REPORT_PREFIX"
          fi
          printf 'destination=%s\n' "$destination" >> "$GITHUB_OUTPUT"

      - name: 🚀 Deploy accessibility report
        if: steps.a11y-test.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-tmp
          destination_dir: ${{ steps.report-path.outputs.destination }}
          allow_empty_commit: true
          user_name: github-actions
          user_email: github-actions@github.com

      - name: 📝 Generate comment body
        if: steps.a11y-test.outcome == 'failure'
        id: generate-comment
        uses: avenirs-esr/avenirs-workflows/.github/actions/generate-comment@main
        with:
          dsav-template: ${{ inputs.flat-report || contains(github.repository, 'dsav') }}
          report-prefix: ${{ inputs.report-prefix }}

      - name: 💬 Comment on PR with dynamic report URLs
        if: steps.a11y-test.outcome == 'failure'
        uses: avenirs-esr/avenirs-workflows/.github/actions/pr-comment@main
        with:
          body: ${{ steps.generate-comment.outputs.comment-body }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: ✅ Check if accessibility tests passed
        if: steps.a11y-test.outcome == 'failure'
        run: exit 1
