name: Build and publish Docker image

# Construit l'image Docker d'un service et la publie sur GHCR
# (ghcr.io/<organisation>/<image_name>).
# Tags produits :
#   - nom de branche (ex. develop)          à chaque push sur une branche
#   - tag git tel quel (ex. 1.2.0)           à chaque tag
#   - sha-<commit court>                     toujours, pour la traçabilité
# Sur une pull request, l'image est construite pour valider le Dockerfile
# mais n'est pas publiée.

on:
  workflow_call:
    inputs:
      image_name:
        description: "Nom de l'image (par défaut : nom du repo)"
        type: string
        default: ""
      context:
        description: "Contexte du build Docker"
        type: string
        default: "."
      dockerfile:
        description: "Chemin du Dockerfile"
        type: string
        default: "Dockerfile"
      push:
        description: "Publier l'image (forcé à false sur une pull request)"
        type: boolean
        default: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🏷️ Image name
        id: name
        shell: bash
        run: |
          name="${{ inputs.image_name }}"
          [ -z "$name" ] && name="${{ github.event.repository.name }}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${name,,}" >> "$GITHUB_OUTPUT"

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GHCR
        if: ${{ inputs.push && github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: 🐳 Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.name.outputs.image }}
          cache-to: type=gha,mode=max,scope=${{ steps.name.outputs.image }}
