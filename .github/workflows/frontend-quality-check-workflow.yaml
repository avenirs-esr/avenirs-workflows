name: PR Code Quality Checks

on:
  workflow_call:
    inputs:
      package-manager:
        type: string
        required: false
        default: pnpm
      working-directory:
        type: string
        required: false
        default: .

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint]
        include:
          - task: typecheck
            name: 🧠 TypeScript type checking
            cmd: "type-check"
            envJson: "{}"
          - task: lint
            name: 🧹 Run ESLint
            cmd: "lint"
            envJson: "{}"

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node + install
        uses: avenirs-esr/avenirs-workflows/.github/actions/setup-node@main
        with:
          package-manager: ${{ inputs.package-manager }}

      - name: 🏗️ Build project
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.package-manager }} run build-only

      - name: ${{ matrix.name }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.package-manager }} run ${{ matrix.cmd }}
        env: ${{ fromJSON(matrix.envJson) }}

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node + install
        uses: avenirs-esr/avenirs-workflows/.github/actions/setup-node@main
        with:
          package-manager: ${{ inputs.package-manager }}

      - name: 🏗️ Build project
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.package-manager }} run build-only

      - name: 🧪 Run unit tests (shard ${{ matrix.shard }}/4)
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          SHARD: ${{ matrix.shard }}
          VITE_ENABLE_MSW: "true"
        run: |
          if [ "$PACKAGE_MANAGER" = pnpm ]; then
            pnpm run test:coverage:shard --shard="$SHARD/4" --outputFile=".vitest-reports/shard-$SHARD.blob"
          else
            npm run test:coverage:shard -- --shard="$SHARD/4" --outputFile=".vitest-reports/shard-$SHARD.blob"
          fi

      - name: 📤 Upload blob report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: ${{ inputs.working-directory }}/.vitest-reports/shard-${{ matrix.shard }}.blob
          include-hidden-files: true
          if-no-files-found: error

  merge-coverage:
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node + install
        uses: avenirs-esr/avenirs-workflows/.github/actions/setup-node@main
        with:
          package-manager: ${{ inputs.package-manager }}

      - name: 📥 Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: ${{ inputs.working-directory }}/blob-reports
          pattern: coverage-shard-*
          merge-multiple: true

      - name: 🔀 Merge reports & check coverage thresholds
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm exec' || 'npx' }} vitest --mergeReports=./blob-reports --coverage.enabled=true --coverage.provider=v8 --coverage.reporter=text --coverage.reporter=html
        env:
          VITE_ENABLE_MSW: "true"

