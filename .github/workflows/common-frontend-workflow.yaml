name: Common Backend Workflow

on:
  workflow_call:
    inputs:
      run_lint:
        type: boolean
        default: true
      run_build:
        type: boolean
        default: true
      run_type_checking:
        type: boolean
        default: true
      run_test_coverage:
        type: boolean
        default: true

jobs:
  lint:
    if: ${{ inputs.run_lint }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}

      - name: 🔎 Lint code
        uses: avenirs-esr/avenirs-workflows/.github/actions/linting-scan@main

  build:
    if: ${{ inputs.run_build }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}

      - name: 🔧 Set up Node.js and install dependencies
        uses: avenirs-esr/avenirs-workflows/.github/actions/setup-node@main

      - name: 🏗️ Build project
        run: npm run build

  type_checking:
    if: ${{ inputs.run_type_checking }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}

      - name: 🔧 Set up Node.js and install dependencies
        uses: avenirs-esr/avenirs-workflows/.github/actions/setup-node@main

      - name: 🧠 TypeScript type checking
        run: npm run type-check

  test_coverage:
    if: ${{ inputs.run_test_coverage }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}

      - name: 🔧 Set up Node.js and install dependencies
        uses: avenirs-esr/avenirs-workflows/.github/actions/setup-node@main

      - name: 🧪 Run unit tests with coverage
        run: npm run test:coverage
